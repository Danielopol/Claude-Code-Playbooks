name: Deploy to Cloudflare

# Builds the site with OpenNext on Linux and deploys the Worker that serves
# www.claudecodehq.com. Runs on every push to the branches below; a branch
# only deploys if this file exists in it, so master starts deploying once
# cloudflare-migration is merged.
on:
  push:
    branches: [master, cloudflare-migration]
  workflow_dispatch:

# Never run two deploys at once; a newer push cancels a queued older one.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Public values inlined into the browser bundle at build time.
      NEXT_PUBLIC_SITE_URL: https://www.claudecodehq.com
      NEXT_PUBLIC_POSTHOG_KEY: phc_kNyKNQAPozw5bcfV8mcrL5KeiMHSysGj8XfdVqtGUqSD
      NEXT_PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
      # Server secrets (Resend, OpenAI challenge) are Worker secrets in
      # Cloudflare, not build inputs — never add them here.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Build (OpenNext + playbook content assets)
        run: npm run cf:build

      - name: Deploy
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
